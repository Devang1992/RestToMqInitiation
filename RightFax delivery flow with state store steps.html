<h1>RightFax delivery flow with state store steps</h1>
<p>Kafka Streams topology: fax filter, dedup, mapping and PDF generation, then a punctuator-driven state machine for the RightFax calls (login session, upload, send job, status poll) behind a circuit breaker.</p>
